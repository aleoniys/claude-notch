<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Claude notch</title>
<style>
  :root {
    --bg: #000; --card: #111113; --line: rgba(255,255,255,.07); --ink: #f5f5f7; --muted: #8e8e93;
    --accent: #d97757; --accent-soft: rgba(217,119,87,.16); --ok: #30d158; --warn: #ffd60a; --bad: #ff453a;
    --track: rgba(255,255,255,.1); --top: 12px;
    --sans: "Segoe UI Variable Display", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --mono: "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); height: 100%; overflow: hidden; font: 13px var(--sans); color: var(--ink); user-select: none; -webkit-font-smoothing: antialiased; }
  body { padding-top: var(--top); }

  /* ---------- compact island ---------- */
  .pill { display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 12px 0 10px; }
  .pill img { width: 22px; height: 22px; object-fit: contain; flex: none; }
  body.working .pill img { animation: bob 1.1s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-1.5px) rotate(-4deg); } }
  .pill .act { flex: 1; min-width: 0; color: var(--muted); font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: fade .3s; }
  .pill .act b { color: var(--ink); font-weight: 600; }
  .pill .act b.done { color: var(--ok); }
  body.compact .pill .act { display: none; }
  body.compact .pill { justify-content: space-between; }
  @keyframes fade { from { opacity: 0; transform: translateY(2px); } }
  .ring { --p: 0; width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(var(--c, var(--ok)) calc(var(--p) * 1%), var(--track) 0); display: grid; place-items: center; flex: none; }
  .ring::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); }
  .pill .pct { font: 600 11.5px var(--mono); color: var(--ink); flex: none; }
  .dots { display: inline-flex; gap: 2.5px; margin-left: 4px; vertical-align: middle; }
  .dots i { width: 3.5px; height: 3.5px; border-radius: 50%; background: var(--accent); animation: dot 1.1s infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 0%, 100% { opacity: .25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-1.5px); } }

  /* ---------- expanded ---------- */
  .panel { width: 560px; padding: 6px 20px 16px; opacity: 0; transform: scale(.96) translateY(-6px); transform-origin: top center; }
  body.open .panel { opacity: 1; transform: none; transition: opacity .22s ease, transform .38s cubic-bezier(.2, 1.3, .35, 1); }
  body.open .pill .act { display: block; }
  body.open .pill { justify-content: flex-start; }

  .head { display: flex; align-items: center; gap: 12px; padding: 6px 0 12px; }
  .head img { width: 44px; height: 44px; object-fit: contain; filter: drop-shadow(0 6px 14px rgba(217,119,87,.35)); }
  .head h1 { font: 600 17px var(--sans); letter-spacing: -.01em; }
  .head p { color: var(--muted); font-size: 12px; margin-top: 1px; }
  .tags { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .tag { padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; background: var(--card); color: var(--muted); white-space: nowrap; border: 1px solid var(--line); }
  .tag.working { background: rgba(48,209,88,.12); color: var(--ok); border-color: transparent; }
  .tag.waiting { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

  .now { margin: 0 0 12px; padding: 9px 12px; border-radius: 14px; background: var(--card); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 1px solid var(--line); }
  .now em { font-style: normal; color: var(--accent); font-weight: 600; margin-right: 6px; }

  .gauges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  .gauge { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px 10px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .dial { --p: 0; --c: var(--accent); width: 68px; height: 68px; border-radius: 50%; display: grid; place-items: center;
          background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--track) 0); transition: --p .6s; }
  .dial::before { content: ""; grid-area: 1 / 1; width: 56px; height: 56px; border-radius: 50%; background: var(--card); }
  .dial b { grid-area: 1 / 1; z-index: 1; font: 600 15px var(--sans); letter-spacing: -.02em; }
  .gauge span { font-size: 11.5px; font-weight: 600; }
  .gauge small { color: var(--muted); font-size: 10.5px; text-align: center; min-height: 13px; }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 11px 13px; min-width: 0; }
  h2 { font: 600 10px var(--mono); letter-spacing: .1em; color: var(--muted); text-transform: uppercase; margin-bottom: 7px; }
  .agent { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: center; padding: 4px 0; font-size: 12px; }
  .agent .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent small { display: block; color: var(--muted); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; }
  .agent .r { color: var(--muted); font: 500 10.5px var(--mono); text-align: right; white-space: nowrap; }
  .spin { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--track); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ok { color: var(--ok); font-weight: 700; font-size: 11px; text-align: center; }
  .irow { display: grid; grid-template-columns: 58px 1fr; gap: 8px; align-items: start; margin: 3px 0; }
  .irow span { color: var(--muted); font-size: 11.5px; padding-top: 1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chips i { font-style: normal; padding: 1px 7px; border-radius: 6px; background: rgba(255,255,255,.07); font-size: 11px; }
  .chips .none { background: none; color: var(--muted); padding: 1px 0; }
  .empty { color: var(--muted); font-size: 12px; }
  .foot { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 11px; padding-top: 12px; }
  .foot button { border: 0; background: var(--card); color: var(--ink); padding: 5px 11px; border-radius: 999px; font: 600 11px var(--sans); cursor: pointer; border: 1px solid var(--line); }
  .foot button:hover { background: var(--accent-soft); color: var(--accent); }
</style>
</head>
<body class="compact">
  <span id="measure" style="position:absolute;left:-9999px;top:0;white-space:nowrap;font:500 12px var(--sans)"></span>
  <div class="pill" id="pill">
    <img class="ico" src="icon.png" alt="">
    <div class="act" id="pAct"></div>
    <div class="ring" id="pRing"></div>
    <div class="pct" id="pPct">—</div>
  </div>
  <div class="panel" id="panel">
    <div class="head">
      <img class="ico" src="icon.png" alt="">
      <div style="min-width:0">
        <h1 id="hProject">Claude Code</h1>
        <p id="hPath"></p>
      </div>
      <div class="tags">
        <div class="tag" id="tModel">—</div>
        <div class="tag" id="tBranch" style="display:none"></div>
        <div class="tag" id="hBadge">—</div>
      </div>
    </div>
    <div class="now" id="sNow"></div>
    <div class="gauges">
      <div class="gauge"><div class="dial" id="g5"><b>—</b></div><span data-i="fiveHours"></span><small id="r5"></small></div>
      <div class="gauge"><div class="dial" id="gW"><b>—</b></div><span data-i="week"></span><small id="rW"></small></div>
      <div class="gauge"><div class="dial" id="gC"><b>—</b></div><span data-i="context"></span><small id="rC"></small></div>
    </div>
    <div class="cols">
      <div class="card"><h2 data-i="agents"></h2><div id="agents"></div></div>
      <div class="card"><h2 data-i="installed"></h2><div id="installed"></div></div>
    </div>
    <div class="foot">
      <span id="fToday"></span>
      <button id="usageBtn" data-i="usage"></button>
    </div>
  </div>
<script>
const $ = (id) => document.getElementById(id);
const fmtK = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? Math.round(n / 1e3) + "k" : String(n);
const fmtDur = (s) => s < 60 ? `${s} ${t("sec")}` : s < 3600 ? `${Math.round(s / 60)} ${t("min")}`
  : s < 86400 ? `${Math.floor(s / 3600)} ${t("hour")} ${Math.round((s % 3600) / 60)} ${t("min")}`
  : `${Math.floor(s / 86400)} ${t("day")} ${Math.round((s % 86400) / 3600)} ${t("hour")}`;
const until = (ts, now) => ts ? t("resetsIn", { t: fmtDur(Math.max(0, Math.round(ts - now))) }) : "";
const color = (p) => p >= 85 ? "var(--bad)" : p >= 60 ? "var(--warn)" : "var(--ok)";
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const TOOL = { Edit: "✎", Write: "✎", Read: "◎", Bash: "›_", PowerShell: "›_", Grep: "⌕", Glob: "⌕", Agent: "◆", WebSearch: "⌕", Skill: "✦" };
const NOTIFY_FOR = 180;          // "done" shows at most 3 minutes, or until the panel is opened
const W = { compact: 112, think: 172, notify: 230, working: 340 };
let S = {};                      // strings for the current language (i18n.json via Python)
const t = (k, v = {}) => String(S[k] ?? k).replace(/\{(\w+)\}/g, (_, n) => v[n] ?? "");
// Pill width for short states follows the text, so every language fits.
function fitWidth(html) {
  const m = $("measure"); m.innerHTML = html;
  return Math.min(380, Math.ceil(m.offsetWidth) + 112);
}

let open = false, pinned = false, mode = "", lastStatus = "", notifyUntil = 0, lastH = 0, _lastData = null;

function dial(id, pct, label, c) {
  const g = $(id);
  g.style.setProperty("--p", Math.min(100, pct));
  g.style.setProperty("--c", c || color(pct));
  g.querySelector("b").textContent = label;
}

function busyMode(s) {
  const a = (s && s.activity) || {};
  return a.kind === "tool" || a.kind === "text" ? "working" : "think";
}

function setMode(m) {
  if (m === mode) return;
  mode = m;
  document.body.classList.toggle("compact", m === "compact");
  if (!open) window.pywebview.api.pill(W[m]);
}

function render(d) {
  const s = d.session || {}, L = d.limits || {}, now = d.now;
  const five = L.five ? L.five.pct : null;
  const a = s.activity || {};
  document.body.classList.toggle("working", s.status === "working");

  if (lastStatus === "working" && s.status === "waiting") notifyUntil = now + NOTIFY_FOR;
  if (s.status === "working") notifyUntil = 0;
  lastStatus = s.status;
  const notify = s.status === "waiting" && now < notifyUntil;
  W.think = fitWidth(`<b>${esc(t("thinking"))}</b><span class="dots"><i></i><i></i><i></i></span>`);
  W.notify = fitWidth(`<b>✓ ${esc(t("done"))}</b> · ${esc(t("waitingForYou"))}`);
  setMode(s.status === "working" ? busyMode(s) : notify ? "notify" : "compact");

  let act = "";
  if (s.status === "working" && a.kind === "tool") act = `<b>${TOOL[a.tool] || "•"} ${esc(a.tool)}</b> ${esc(a.text)}`;
  else if (s.status === "working" && a.kind === "text") act = `<b>${esc(t("writing"))}</b> ${esc(a.text)}`;
  else if (s.status === "working") act = `<b>${esc(t("thinking"))}</b><span class="dots"><i></i><i></i><i></i></span>`;
  else if (notify) act = `<b class="done">✓ ${esc(t("done"))}</b> · ${esc(t("waitingForYou"))}`;
  else act = `<b>${esc(s.project || "Claude")}</b>`;
  $("pAct").innerHTML = act;
  $("pPct").textContent = five == null ? "—" : five + "%";
  const ring = $("pRing"); ring.style.setProperty("--p", five || 0); ring.style.setProperty("--c", color(five || 0));

  $("hProject").textContent = s.project || "Claude Code";
  $("hPath").textContent = s.parent ? s.parent + " / " + s.project : "";
  $("tModel").textContent = s.model || "—";
  const br = $("tBranch");
  if (s.branch && s.branch !== "HEAD") { br.style.display = ""; br.textContent = "⑂ " + s.branch; } else br.style.display = "none";
  const badge = $("hBadge");
  badge.className = "tag " + (s.status || "");
  badge.textContent = { working: "● " + t("statusWorking"), waiting: "● " + t("statusWaiting"), sleeping: t("statusSleeping") }[s.status] || "—";
  const nowEl = $("sNow");
  if (s.status === "working") { nowEl.style.display = ""; nowEl.innerHTML = a.text ? `<em>${esc(a.tool || t("now"))}</em>${esc(a.text)}` : `<em>${esc(t("now"))}</em>${esc(t("thinkingLong"))}`; }
  else nowEl.style.display = "none";

  if (L.five) { dial("g5", L.five.pct, L.five.pct + "%"); $("r5").textContent = until(L.five.resets, now); }
  if (L.week) { dial("gW", L.week.pct, L.week.pct + "%"); $("rW").textContent = until(L.week.resets, now); }
  if (s.window) {
    const pc = Math.round((s.context / s.window) * 100);
    dial("gC", pc, pc + "%", pc >= 80 ? "var(--bad)" : "var(--accent)");
    $("rC").textContent = t("ofTotal", { a: fmtK(s.context), b: fmtK(s.window) }) + (pc >= 80 ? " · /compact" : "");
  }

  const ag = (s.agents || []).slice(0, 4);
  $("agents").innerHTML = ag.length ? ag.map((x) => `
    <div class="agent">
      ${x.running ? '<div class="spin"></div>' : '<div class="ok">✓</div>'}
      <div class="n">${esc(x.name)}<small>${esc(x.type)} · ${esc(x.model)}</small></div>
      <div class="r">${x.running ? fmtDur(x.seconds) : fmtDur(x.ago)}<br>${fmtK(x.tokens)}</div>
    </div>`).join("") : `<div class="empty">${esc(t("noAgents"))}</div>`;

  const I = d.installed || {};
  const chips = (label, arr) => `<div class="irow"><span>${label}</span><div class="chips">${arr.length ? arr.map((x) => `<i>${esc(x)}</i>`).join("") : '<i class="none">—</i>'}</div></div>`;
  $("installed").innerHTML = chips(esc(t("skills")), I.skills || []) + chips(esc(t("plugins")), I.plugins || []) + chips(esc(t("mcp")), I.mcp || []) + chips(esc(t("customAgents")), I.agents || []);

  const today = d.today || {};
  $("fToday").textContent = t("today", { t: fmtK(today.tokens || 0), s: today.sessions || 0 });
  if (open) {
    const h = panelHeight();
    if (h !== lastH) { lastH = h; window.pywebview.api.expand(h); }
  }
}

function panelHeight() {
  return Math.min($("panel").scrollHeight + 34, Math.round(window.screen.availHeight * 0.92));
}

async function setOpen(v) {
  if (v === open) return;
  open = v;
  if (v) {
    notifyUntil = 0;                      // the user has seen it
    lastH = panelHeight();
    await window.pywebview.api.expand(lastH);
    if (!open) return;
    requestAnimationFrame(() => document.body.classList.add("open"));
  } else {
    document.body.classList.remove("open");
    pinned = false;
    mode = lastStatus === "working" ? busyMode(_lastData && _lastData.session) : "compact";
    document.body.classList.toggle("compact", mode === "compact");
    window.pywebview.api.collapse(W[mode]);
  }
}

$("pill").addEventListener("mouseenter", () => setOpen(true));
document.addEventListener("mouseenter", () => { pinned = false; });
$("usageBtn").addEventListener("click", () => window.pywebview.api.open_url("https://claude.ai/settings/usage"));
window.pinOpen = (v) => { pinned = v; setOpen(v); };
window.autoClose = () => {
  if (pinned) return;
  if (open) setOpen(false);
  else window.pywebview.api.collapse(W[mode] || W.compact);
};
window.onerror = (m) => { try { window.pywebview.api.log(m); } catch (e) {} };

async function tick() { try { _lastData = await window.pywebview.api.data(); render(_lastData); } catch (e) {} }
let started = false;
async function boot() {
  if (started || !window.pywebview || !window.pywebview.api || !window.pywebview.api.data) return;
  started = true;
  try {
    S = await window.pywebview.api.strings();
    document.documentElement.lang = S._lang || "en";
    document.querySelectorAll("[data-i]").forEach((el) => { el.textContent = t(el.dataset.i); });
    const icon = await window.pywebview.api.icon();
    document.querySelectorAll("img.ico").forEach((img) => { img.src = icon; });
  } catch (e) {}
  tick(); setInterval(tick, 3000);
}
window.addEventListener("pywebviewready", boot);
setInterval(boot, 300);
</script>
</body>
</html>
